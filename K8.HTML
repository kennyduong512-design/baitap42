
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tính chỉ số BMI</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            padding: 30px;
        }

        .container {
            max-width: 400px;
            margin: auto;
            padding: 25px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px #00000015;
        }

        h2 {
            text-align: center;
            color: #2563eb;
        }

        label {
            display: block;
            margin-top: 15px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        #ketqua {
            margin-top: 20px;
            line-height: 1.8;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Tính chỉ số BMI</h2>

        <label for="canNang">Cân nặng (kg):</label>
        <input type="number" id="canNang" placeholder="Ví dụ: 60" min="1" step="any">

        <label for="chieuCao">Chiều cao (m):</label>
        <input type="number" id="chieuCao" placeholder="Ví dụ: 1.7" min="0.1" step="any">

        <button onclick="tinhBMI()">Tính BMI</button>

        <div id="ketqua"></div>
    </div>

    <script>
        function tinhBMI() {
            let canNang = Number(document.getElementById("canNang").value);
            let chieuCao = Number(document.getElementById("chieuCao").value);
            let ketqua = document.getElementById("ketqua");

            if (canNang <= 0 || chieuCao <= 0 ||
                !Number.isFinite(canNang) ||
                !Number.isFinite(chieuCao) ||
                document.getElementById("canNang").value === "" ||
                document.getElementById("chieuCao").value === "") {
                ketqua.textContent = "Vui lòng nhập cân nặng và chiều cao hợp lệ!";
                return;
            }

            let bmi = canNang / (chieuCao * chieuCao);
            let phanLoai = "";

            if (bmi < 18.5) {
                phanLoai = "Thiếu cân";
            } else if (bmi < 25) {
                phanLoai = "Bình thường";
            } else {
                phanLoai = "Thừa cân";
            }

            ketqua.innerHTML =
                "Chỉ số BMI: " + bmi.toFixed(2) +
                "<br>Phân loại: " + phanLoai;
        }
    </script>
</body>
</html>
