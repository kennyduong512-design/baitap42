
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Chuyển đổi Hex sang RGB</title>
</head>
<body>
    <h2>Chuyển mã màu Hex sang RGB</h2>

    <input type="text" id="hex" value="#FF0000">
    <button onclick="chuyenDoi()">Chuyển đổi</button>

    <p id="ketqua"></p>

    <script>
        function hexToRGB(hex) {
            hex = hex.replace("#", "");

            let r = parseInt(hex.substring(0, 2), 16);
            let g = parseInt(hex.substring(2, 4), 16);
            let b = parseInt(hex.substring(4, 6), 16);

            return "rgb(" + r + ", " + g + ", " + b + ")";
        }

        function chuyenDoi() {
            let hex = document.getElementById("hex").value;
            let rgb = hexToRGB(hex);

            document.getElementById("ketqua").textContent =
                "Kết quả: " + rgb;
        }
    </script>
</body>
</html>
